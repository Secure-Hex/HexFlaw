[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexflaw"
version = "0.1.0"
description = "AI-powered source code vulnerability analyzer — by SecureHex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "SecureHex", email = "contacto@securehex.cl" }]
keywords = ["security", "sast", "vulnerability", "llm", "static-analysis"]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "anthropic>=0.40.0",
    "structlog>=24.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Backends pesados — opcionales para no bloquear el slice vertical.
embeddings = [
    "sentence-transformers>=2.7.0",
]
treesitter = [
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.2.0",
]
pdf = ["weasyprint>=61.0"]
secrets = ["keyring>=24.0"]
tui = ["textual>=0.50"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
]

[project.scripts]
hexflaw = "hexflaw.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["hexflaw"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
