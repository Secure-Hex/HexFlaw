[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hexflaw"
version = "0.2.0"
description = "AI-powered source code vulnerability analyzer — by SecureHex"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "SecureHex", email = "contacto@securehex.cl" }]
keywords = ["security", "sast", "vulnerability", "llm", "static-analysis"]
# Sin clasificador de licencia: ya se declara arriba y PyPI rechaza la duplicación
# cuando la licencia va como expresión SPDX (Metadata-Version 2.4).
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pydantic>=2.6.0",
    "anthropic>=0.40.0",
    "structlog>=24.1.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
# Backends pesados — opcionales para no bloquear el slice vertical.
embeddings = [
    "sentence-transformers>=2.7.0",
]
treesitter = [
    "tree-sitter>=0.21.0",
    "tree-sitter-language-pack>=0.2.0",
]
pdf = ["weasyprint>=61.0"]
secrets = ["keyring>=24.0"]
tui = ["textual>=0.50"]
openai = ["openai>=1.40"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "mypy>=1.9",
    "ruff>=0.4",
    "build>=1.2",
    "twine>=5.0",
    "python-semantic-release>=10.0",
]

[project.urls]
Homepage = "https://github.com/Secure-Hex/HexFlaw"
Repository = "https://github.com/Secure-Hex/HexFlaw"
Issues = "https://github.com/Secure-Hex/HexFlaw/issues"
Security = "https://github.com/Secure-Hex/HexFlaw/blob/main/SECURITY.md"

[project.scripts]
hexflaw = "hexflaw.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["hexflaw"]

[tool.semantic_release]
# La versión y el CHANGELOG se derivan de los conventional commits: nadie edita
# 'version' a mano. 'feat' sube minor, 'fix' sube patch, 'BREAKING CHANGE' sube
# major; los commits 'chore'/'docs'/'test'/'style' no publican nada.
version_toml = ["pyproject.toml:project.version"]
commit_parser = "conventional"
tag_format = "v{version}"
# major_on_zero = false: en 0.x un 'feat' sube 0.2 → 0.3, no 0.x → 1.0. El salto
# a 1.0 es una decisión de producto, no algo que dispare un commit.
major_on_zero = false
allow_zero_version = true
build_command = "python -m pip install build && python -m build"
commit_message = "chore(release): {version}\n\n[skip ci]"

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.semantic_release.changelog]
mode = "update"
exclude_commit_patterns = [
    # Ruido que no le dice nada a quien lee el changelog.
    '''^chore\(release\):''',
    '''^Merge (branch|pull request)''',
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"
output_format = "md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
# Directorios de herramientas de agentes vendorizadas en el repo: no son código
# del proyecto y no siguen su estilo.
extend-exclude = [".agents", ".atl", ".claude", ".kilocode", ".qwen", "benchmarks/vendor"]

[tool.mypy]
# Sin 'python_version': mypy usa el intérprete con el que corre. Pinearlo en 3.11
# rompe con dependencias transitivas modernas (numpy 2.5 ya no soporta 3.11 y sus
# stubs usan sintaxis 3.12, error de parseo que ningún override silencia). La
# compatibilidad con 3.11 se valida corriendo la suite en un env 3.11, no acá.
strict = true
warn_unused_ignores = true
# El plugin de pydantic entiende 'populate_by_name': sin él, construir un modelo
# por nombre de campo cuando existe un alias (GraphEdge(from_=...)) da falso error.
plugins = ["pydantic.mypy"]
# tests/fixtures/ son codebases de juguete para analizar, no código a type-checkear.
exclude = ["^\\.(agents|atl|claude|kilocode|qwen)/", "^benchmarks/vendor/", "^tests/fixtures/"]

# Extras opcionales sin stubs: el type-check no debe fallar cuando el extra no
# está instalado (es justamente lo que pasa en CI sin '.[tui]').
[[tool.mypy.overrides]]
module = ["textual.*", "tree_sitter_language_pack.*", "weasyprint.*", "keyring.*", "openai.*"]
ignore_missing_imports = true

# El TUI hereda de clases de textual (extra opcional 'tui'). Sin el paquete
# instalado esas bases son Any, y de eso no se sale anotando: hay que permitir
# heredar de Any y usar sus decoradores. El resto del strict sigue vigente acá.
[[tool.mypy.overrides]]
module = ["hexflaw.tui.*"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

# Librerías pesadas que sí están instaladas pero cuyos stubs no nos interesan:
# hexflaw no importa numpy y sus stubs exigen python_version >= 3.12, mientras el
# proyecto declara soporte 3.11. Se saltea el seguimiento, no se relaja el strict.
[[tool.mypy.overrides]]
module = ["sentence_transformers.*", "numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"
